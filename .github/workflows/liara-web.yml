name: Deploy website and panels to Liara

# Deploy the current Liara website on main pushes or manual dispatch.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liara-evazmelk-web-production
  cancel-in-progress: false

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            admin/package-lock.json
      - name: Check deployment secret
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          if [ -z "$LIARA_TOKEN" ]; then
            echo 'Add LIARA_API_TOKEN in repository Settings > Secrets and variables > Actions.'
            exit 1
          fi
      - name: Install website dependencies
        run: npm ci --prefix frontend --no-audit --no-fund
      - name: Install admin dependencies
        run: npm ci --prefix admin --no-audit --no-fund
      - name: Install test dependencies
        run: npm ci --prefix qa --no-audit --no-fund
      - name: Check website and admin types
        run: |
          npm run check --prefix frontend
          npm run check --prefix admin
      - name: Test website before release
        env:
          JSDOM_MODULE: ${{ github.workspace }}/qa/node_modules/jsdom/lib/api.js
        run: node --test frontend/tests/*.test.mjs
      - name: Build website and panels
        env:
          VITE_NESHAN_MAP_KEY: ${{ secrets.VITE_NESHAN_MAP_KEY }}
        run: node build-liara.mjs
      - name: Wait for Liara backend SEO routes
        run: |
          curl --fail --silent --show-error --retry 24 --retry-delay 10 --retry-all-errors --max-time 20 \
            https://backend.evazmelk.ir/api/public/seo/sitemap.xml --output /dev/null
      - name: Install Liara CLI
        run: npm install --global @liara/cli@9 --no-audit --no-fund
      - name: Deploy static output to evazmelk-web
        working-directory: liara-web-dist
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: liara deploy --app="evazmelk-web" --api-token="$LIARA_TOKEN" --no-app-logs
