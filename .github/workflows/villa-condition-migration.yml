name: Apply villa condition migration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evazmelk-villa-condition-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: postgres:18-bookworm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Apply migration 0022
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGCONNECT_TIMEOUT: '15'
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo 'The DATABASE_URL repository secret is missing.' >&2
            exit 1
          fi
          psql --dbname="$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -c "SET lock_timeout = '10s'; SET statement_timeout = '60s';" \
            -f database/migrations/0022_villa_house_conditions.sql
